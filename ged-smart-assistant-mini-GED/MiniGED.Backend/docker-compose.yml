services:
  postgres:
    image: postgres:15
    container_name: miniged-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=MiniGed
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
